[project]
name = "complexweights"
version = "0.1.0"
description = "Phase Without Position: can complex-valued transformer weights subsume positional encoding?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "einops>=0.8",
    "tyro>=0.8",
    "tqdm>=4.66",
    "marimo>=0.9",
    "plotly>=5.24",
    "pandas>=2.2",
    "pytest>=8.0",
    "wandb>=0.17",
    "matplotlib>=3.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["complexnn"]

# Pull torch from the official CUDA 12.4 index. cu124 wheels include Pascal (sm_61,
# the local GTX 1050) through Ampere (sm_80, the Unity A100), and the CUDA 12.4
# runtime is forward-compatible with the local CUDA 13 driver.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
